<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U-BASE Recruitment Intelligence</title><link rel="stylesheet" href="style.css"><script defer src="vendor/xlsx.full.min.js"></script><script defer src="script.js"></script></head>
<body><aside><div class="brand">U-BASE<span>Recruitment Intelligence</span></div><div class="nav-label">WORKSPACE</div><nav aria-label="주 메뉴"></nav><div class="aside-footer">LOCAL WORKSPACE<br>데이터는 이 브라우저에 저장됩니다.</div></aside><main><header><div><small>RECRUITMENT INTELLIGENCE</small><h1 id="page-title">종합 대시보드</h1><p>채용의 흐름을 한눈에, 더 나은 의사결정으로.</p></div><button id="manage">데이터 관리</button></header><section class="filters" aria-label="데이터 필터"><label>시작일<input type="date" id="from"></label><label>종료일<input type="date" id="to"></label><label>센터<select id="center"></select></label><label>직무<select id="job"></select></label><label>매체<select id="media"></select></label><button id="reset" class="secondary">초기화</button></section><div id="notice" role="status" aria-live="polite"></div><div id="content"></div><footer>U-BASE · Recruitment Intelligence <span>실제 등록 데이터 기준 · 외부 전송 없음</span></footer></main>
<dialog id="data-dialog"><div class="dialog-head"><div><small>DATA WORKSPACE</small><h2>데이터 관리</h2></div><button id="close-dialog" class="secondary">닫기</button></div><p>각 파일을 개별 등록하세요. 첫 번째 데이터 시트를 읽고, 헤더를 자동 인식합니다. 필요한 경우 컬럼을 직접 연결할 수 있습니다.</p><label>등록 방식 <select id="upload-mode"><option value="replace">해당 유형 데이터 교체</option><option value="append">기존 데이터에 누적</option></select></label><div id="uploads"></div><div id="mapping"></div><div id="channel-mapping" style="margin-top:20px"></div><div class="backup"><button id="backup">전체 백업</button><label class="file-button secondary">백업 복원<input type="file" id="restore" accept=".json"></label><button id="delete-data" class="danger">전체 데이터 삭제</button></div><p id="storage-status"></p></dialog>
</body></html>
